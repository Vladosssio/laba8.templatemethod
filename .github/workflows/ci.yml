name: C++ CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install g++
      run: sudo apt update && sudo apt install g++ -y
    - name: Compile
      run: g++ -o program main.cpp
    - name: Run tests
      run: ./program
